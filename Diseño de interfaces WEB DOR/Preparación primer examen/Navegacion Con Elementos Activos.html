<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Navegación CSS</title>
  <style>
    nav a {
      text-decoration: none;
      padding: 10px;
      display: inline-block;
    }
    nav a:hover {
      background-color: #310dd4;
      color: white;
    }
    nav a:active {
      background-color: #ca0b0b;
      color: rgb(29, 246, 25);
    }
  </style>
</head>
<body>
  <nav>
    <a href="#inicio">Inicio</a>
    <a href="#servicios">Servicios</a>
    <a href="#contacto">Contacto</a>
  </nav>
</body>
</html>
