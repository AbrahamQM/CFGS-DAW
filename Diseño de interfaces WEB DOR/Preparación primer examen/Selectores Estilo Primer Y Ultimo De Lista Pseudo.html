<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Lista CSS</title>
  <style>
    li{padding: 20px;} /*separacion entre elementos li*/
    li:first-child { /*prinmer elemento*/
      font-weight: bold;
      background-color: red;
    }
    li:last-child { /*último elemento li*/
      color: blue;
    }
    div{ /*centro el div y adapto el */
      display: flex;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div>
    <ul>
      <li>Primer elemento</li>
      <li>Elemento medio</li>
      <li>Último elemento</li>
    </ul>

  </div>
</body>
</html>
