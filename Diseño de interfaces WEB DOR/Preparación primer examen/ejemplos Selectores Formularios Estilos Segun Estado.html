<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Formularios CSS</title>
  <style>
    input:focus {
      border-color: green;
    }
    input:disabled {
      background-color: #ddd;
    }
  </style>
</head>
<body>
  <form>
    <input type="text" placeholder="Habilitado"><br>
    <input type="text" placeholder="Deshabilitado" disabled>
  </form>
</body>
</html>
