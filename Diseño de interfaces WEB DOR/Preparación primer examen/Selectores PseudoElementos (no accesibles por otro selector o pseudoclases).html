<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tabla con CSS</title>
  <style>
    tr:nth-child(odd) {
      background-color: #17d93e;
    }
    tr:nth-child(even) {
      background-color: #cb0b0b;
    }
  </style>
</head>
<body>
  <table>
    <tr><td>Fila 1</td></tr>
    <tr><td>Fila 2</td></tr>
    <tr><td>Fila 3</td></tr>
    <tr><td>Fila 4</td></tr>
  </table>
</body>
</html>
