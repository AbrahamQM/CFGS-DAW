<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Lista CSS</title>
  <style>
    li:first-child {
      font-weight: bold;
    }
    li:last-child {
      color: blue;
    }
  </style>
</head>
<body>
  <ul>
    <li>Primer elemento</li>
    <li>Elemento medio</li>
    <li>Último elemento</li>
  </ul>
</body>
</html>
