<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Selector de Tipo de Etiqueta</title>
  <style>
    p {
      font-family: Arial, sans-serif;
      line-height: 3;
      color: #c40f0f;
    }
    p strong {
      color: #07f91b;
      background-color: red;
    }
  </style>
</head>
<body>
  <p>Selector de etiqueta p Este es un párrafo con estilo aplicado a todos los párrafos.</p>
  <p> <strong>SELECTOR DESCENDIENTE: Otro párrafo negrita etiqueta strong dentro de un p</strong></p>
  <div>Este es el div que al no ser un párrafo no tiene ese estilo</div>
</body>
</html>
