<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Curso de Diseño Web</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="day-mode">
    <div class="container mt-5">
        <h1 class="text-center mb-4">Inscripción al Curso de Diseño Web</h1>
        <div class="text-center mb-4 mode-selector">
            <div id="modeToggle" class="mode-toggle"></div>
        </div>
        <form id="courseForm" class="p-4 rounded shadow">
            <div class="mb-3">
                <label for="name" class="form-label">Nombre completo</label>
                <input type="text" class="form-control" id="name" placeholder="Ingresa tu nombre completo" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="email" placeholder="correo@ejemplo.com" required>
            </div>
            <div class="mb-3">
                <label for="phone" class="form-label">Teléfono</label>
                <input type="tel" class="form-control" id="phone" placeholder="+34 600 123 456" required>
            </div>
            <div class="mb-3">
                <label for="experience" class="form-label">Nivel de experiencia</label>
                <select class="form-select" id="experience" required>
                    <option value="" selected disabled>Selecciona tu nivel</option>
                    <option value="principiante">Principiante</option>
                    <option value="intermedio">Intermedio</option>
                    <option value="avanzado">Avanzado</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="preferences" class="form-label">Áreas de interés</label>
                <textarea class="form-control" id="preferences" rows="3" placeholder="Cuéntanos qué te interesa aprender..." required></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Horario preferido</label>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="schedule" id="morning" value="mañana" required>
                    <label class="form-check-label" for="morning">Mañana</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="schedule" id="afternoon" value="tarde">
                    <label class="form-check-label" for="afternoon">Tarde</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="schedule" id="evening" value="noche">
                    <label class="form-check-label" for="evening">Noche</label>
                </div>
            </div>
            <div class="text-center">
                <button type="submit" class="btn btn-primary w-100">Enviar</button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
    <script>
        document.getElementById('modeToggle').addEventListener('click', function() {
            document.body.classList.toggle('dark-mode');
            document.body.classList.toggle('day-mode');
        });
    </script>
</body>
</html>
