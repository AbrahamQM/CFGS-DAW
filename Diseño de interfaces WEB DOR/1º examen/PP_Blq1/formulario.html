<body class="day-mode">
    <header class="text-center py-3">
        <h1>Club de lectura R.R. Tolkien</h1>
    </header>
    <nav class="navbar navbar-expand-lg " >
        <div class="container-fluid">
            <a class="navbar-brand" href="./index.html">Inicio</a>
            <a class="navbar-brand" href="./index.html">Inicio</a>
            <a class="navbar-brand" href="https://es.wikipedia.org/wiki/J._R._R._Tolkien">Wikipedia de Tolkien</a>

                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon">
                </span>
            </button> -->
        </div>
    </nav>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Formulario de inscripción al Club de lectura JRR Tolkien</h1>
        <form id="courseForm" class="p-4 rounded shadow">
            <div class="mb-3">
                <label for="name" class="form-label">Nombre completo</label>
                <input type="text" class="form-control" id="name" placeholder="Ingresa tu nombre completo" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="email" placeholder="correo@ejemplo.com" required>
            </div>
            <div class="mb-3">
                <label for="phone" class="form-label">Teléfono</label>
                <input type="tel" class="form-control" id="phone" placeholder="+34 600 123 456" required>
            </div>
            <div class="mb-3">
                <label for="preferences" class="form-label">Presentación</label>
                <textarea class="form-control" id="preferences" rows="3" placeholder="Cuéntanos qué te interesa pertenecer al club y que puedes aportar..." required></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Formato de libro preferido</label>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="schedule" id="electronico" value="mañana" required>
                    <label class="form-check-label" for="electronico">e-book</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="schedule" id="papel" value="tarde">
                    <label class="form-check-label" for="papel">Papel</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="schedule" id="evening" value="noche">
                    <label class="form-check-label" for="evening">Noche</label>
                </div>
            </div>
            <div class="text-center">
                <button type="submit" class="enviar">Enviar</button>
            </div>
        </form>
    </div>
    <footer>
        <p>&copy; 2025 Ejercicio Práctico. Bloque1.</p>
        <div class="rrss">
                    <a href="https://instagram.com" target="_blank" rel="noopener noreferrer">

                    <a href="https://facebook.com" target="_blank" >

        </div>
